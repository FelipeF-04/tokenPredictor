<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>AI Usage Predictor</title>
  </head>
  <body class="ai-popup">
    <div class="ai-card">
      <div class="ai-title">AI Usage Predictor</div>
      <div class="ai-row">
        <span>Model</span>
        <select id="modelSelect" class="ai-select"></select>
      </div>
      <div class="ai-row">
        <span>Context window</span>
        <span id="contextWindow">-</span>
      </div>
      <div class="ai-row">
        <span>Actual session tokens</span>
        <span id="sessionTokens">0</span>
      </div>
      <div class="ai-meter">
        <div class="ai-meter-fill" id="riskFill"></div>
      </div>
      <div class="ai-risk-label" id="riskLabel">green</div>
      <div class="ai-sync-status" id="syncStatus" role="status" aria-live="polite">
        Session synced
      </div>
      <button class="ai-button" id="resetBtn">Reset session</button>
      <div class="ai-note" id="statusText"></div>
    </div>
    <script src="shared/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
